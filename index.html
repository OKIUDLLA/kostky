<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f2430">
<title>Kostky</title>
<style>
  :root {
    --bg: #1b1f2a;
    --panel: #262c3a;
    --panel2: #2f3647;
    --line: #3a4256;
    --text: #eef1f7;
    --muted: #9aa3b8;
    --danger: #e5484d;
    --ok: #30c98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    flex: 0 0 auto;
  }
  header .title { font-size: 1.05rem; font-weight: 700; letter-spacing: .3px; }
  header .actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--panel2);
    border: none;
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: .9rem;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--line); }

  /* Players */
  .players {
    display: grid;
    gap: 10px;
    padding: 4px 12px 8px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    align-content: start;
  }
  .players.cols-1 { grid-template-columns: 1fr; }
  .players.cols-2 { grid-template-columns: 1fr 1fr; }
  .player {
    background: var(--panel);
    border-radius: 16px;
    border: 2px solid transparent;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color .15s, background .15s, transform .1s;
    overflow: hidden;
    min-height: 0;
  }
  .player:active { transform: scale(.99); }
  .player.active { background: var(--panel2); }
  .player .name {
    font-size: .95rem;
    font-weight: 600;
    color: var(--muted);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player .score {
    font-weight: 800;
    line-height: 1.05;
    margin: 2px 0;
    font-variant-numeric: tabular-nums;
  }
  .players.cols-1 .player .score { font-size: clamp(2.2rem, 11vw, 3.4rem); }
  .players.cols-2 .player .score { font-size: clamp(1.8rem, 9vw, 3rem); }
  .player .meta { font-size: .7rem; color: var(--muted); min-height: 1em; text-align: center; }
  .player .meta b { color: var(--danger); }
  .dots { display: flex; gap: 5px; margin-top: 6px; height: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--danger); }
  .turn-tag {
    position: absolute;
    top: 7px;
    font-size: .6rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
  }
  .player.active .turn-tag { opacity: 1; }
  .last {
    margin-top: 5px;
    font-size: .68rem;
    color: var(--muted);
    height: 1em;
    overflow: hidden;
    white-space: nowrap;
    max-width: 100%;
  }

  /* Entry display */
  .entry {
    flex: 0 0 auto;
    margin: 0 12px 8px;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .entry .label { font-size: .78rem; color: var(--muted); }
  .entry .label b { color: var(--text); }
  .entry .value {
    font-size: 2rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    min-width: 1ch;
  }
  .entry .value.empty { color: var(--muted); }

  /* Keypad */
  .keypad {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 0 12px 10px;
  }
  .key {
    border: none;
    border-radius: 14px;
    background: var(--panel2);
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 700;
    padding: 13px 0;
    cursor: pointer;
    transition: transform .05s, background .1s;
    font-variant-numeric: tabular-nums;
  }
  .key:active { transform: scale(.95); background: var(--line); }
  .key.fn { font-size: 1.25rem; background: var(--panel); color: var(--muted); }
  .key.add {
    grid-column: span 3;
    background: var(--ok);
    color: #06251a;
    font-size: 1.2rem;
    letter-spacing: .3px;
  }
  .key.add:active { background: #28b27a; }

  /* Overlays */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 18, .72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--panel);
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 16px; font-size: 1.15rem; }
  .sheet h3 { margin: 18px 0 8px; font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .field input, .player-row input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 1rem;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .player-row .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .player-row input { flex: 1; }
  .player-row .remove {
    flex: 0 0 auto;
    background: var(--panel2);
    border: none;
    color: var(--danger);
    border-radius: 9px;
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .player-row .remove:disabled { color: var(--muted); opacity: .4; }
  .add-player {
    width: 100%;
    background: var(--panel2);
    border: 1px dashed var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 11px;
    font-size: .95rem;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-player:disabled { opacity: .4; }
  .hint { font-size: .72rem; color: var(--muted); margin: 6px 0 0; }
  .sheet .row { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: #4f6cff; color: #fff; }
  .btn.ghost { background: var(--panel2); color: var(--text); }

  .win-emoji { font-size: 3rem; text-align: center; margin-bottom: 6px; }
  .win-text { text-align: center; font-size: 1.25rem; font-weight: 700; margin-bottom: 18px; }
</style>
</head>
<body>
  <header>
    <div class="title">🎲 Kostky</div>
    <div class="actions">
      <button class="icon-btn" id="undoBtn">↩︎ Zpět</button>
      <button class="icon-btn" id="settingsBtn">⚙︎ <span id="targetLabel">350</span></button>
    </div>
  </header>

  <div class="players" id="players"></div>

  <div class="entry">
    <div class="label">Na tahu: <b id="turnName">Hráč 1</b></div>
    <div class="value empty" id="entryValue">0</div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-d="1">1</button>
    <button class="key" data-d="2">2</button>
    <button class="key" data-d="3">3</button>
    <button class="key" data-d="4">4</button>
    <button class="key" data-d="5">5</button>
    <button class="key" data-d="6">6</button>
    <button class="key" data-d="7">7</button>
    <button class="key" data-d="8">8</button>
    <button class="key" data-d="9">9</button>
    <button class="key fn" data-act="clear">C</button>
    <button class="key" data-d="0">0</button>
    <button class="key fn" data-act="back">⌫</button>
    <button class="key add" id="addBtn" data-act="add">Přičíst ✓</button>
  </div>

  <!-- Settings -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h2>Nastavení</h2>

      <h3>Hráči</h3>
      <div id="playerList"></div>
      <button class="add-player" id="addPlayerBtn">+ Přidat hráče</button>
      <p class="hint">2 až 8 hráčů.</p>

      <h3>Cíl</h3>
      <div class="field">
        <input type="number" id="targetInput" inputmode="numeric" min="350" step="50">
      </div>
      <p class="hint">Minimum je 350.</p>

      <div class="row">
        <button class="btn ghost" id="newGameBtn">Nová hra</button>
        <button class="btn primary" id="saveBtn">Uložit</button>
      </div>
    </div>
  </div>

  <!-- Winner -->
  <div class="overlay" id="winOverlay">
    <div class="sheet">
      <div class="win-emoji">🏆</div>
      <div class="win-text" id="winText"></div>
      <div class="row">
        <button class="btn primary" id="winNewGame">Nová hra</button>
      </div>
    </div>
  </div>

  <script>
    const MIN_TARGET = 350;
    const MIN_PLAYERS = 2;
    const MAX_PLAYERS = 8;
    const LS_KEY = "kostky-state-v2";
    const PALETTE = ["#4f6cff", "#f0883e", "#30c98a", "#e5484d", "#b07cff", "#f5c542", "#33bfd0", "#ff73c3"];

    let state = loadState() || freshState(2);

    function makePlayer(i) {
      return { name: "Hráč " + (i + 1), score: 0, zeroStreak: 0, history: [] };
    }
    function freshState(count) {
      const players = [];
      for (let i = 0; i < count; i++) players.push(makePlayer(i));
      return { target: MIN_TARGET, active: 0, gameOver: false, players };
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(LS_KEY));
        if (s && Array.isArray(s.players) && s.players.length >= MIN_PLAYERS) return s;
      } catch (e) {}
      // zkusit migraci ze starší verze
      try {
        const old = JSON.parse(localStorage.getItem("kostky-state-v1"));
        if (old && Array.isArray(old.players)) return old;
      } catch (e) {}
      return null;
    }
    function saveState() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    }

    let entry = "";

    const playersEl = document.getElementById("players");
    const entryValueEl = document.getElementById("entryValue");
    const turnNameEl = document.getElementById("turnName");
    const targetLabelEl = document.getElementById("targetLabel");

    function colorOf(i) { return PALETTE[i % PALETTE.length]; }

    function renderPlayers() {
      playersEl.innerHTML = "";
      const n = state.players.length;
      playersEl.className = "players " + (n <= 1 ? "cols-1" : "cols-2");
      state.players.forEach((p, idx) => {
        const col = colorOf(idx);
        const card = document.createElement("div");
        card.className = "player" + (idx === state.active ? " active" : "");
        if (idx === state.active) card.style.borderColor = col;
        const dots = [0, 1, 2].map(i =>
          `<span class="dot ${i < p.zeroStreak ? "on" : ""}"></span>`).join("");
        const last = p.history.length ? "poslední: " + p.history.slice(-3).join(" · ") : "";
        card.innerHTML = `
          <span class="turn-tag" style="color:${col}">na tahu</span>
          <div class="name" style="${idx === state.active ? "color:" + col : ""}">${escapeHtml(p.name)}</div>
          <div class="score">${p.score}</div>
          <div class="meta">${p.zeroStreak === 2 ? "<b>⚠ další 0 = reset!</b>" : "&nbsp;"}</div>
          <div class="dots">${dots}</div>
          <div class="last">${escapeHtml(last)}</div>
        `;
        card.onclick = () => { if (!state.gameOver) { state.active = idx; render(); } };
        playersEl.appendChild(card);
      });
    }

    function renderEntry() {
      if (entry === "") {
        entryValueEl.textContent = "0";
        entryValueEl.classList.add("empty");
      } else {
        entryValueEl.textContent = entry;
        entryValueEl.classList.remove("empty");
      }
      turnNameEl.textContent = state.players[state.active].name;
    }

    function render() {
      if (state.active >= state.players.length) state.active = 0;
      renderPlayers();
      renderEntry();
      targetLabelEl.textContent = state.target;
      saveState();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function pressDigit(d) {
      if (state.gameOver) return;
      if (entry === "0") entry = "";
      if (entry.length >= 4) return;
      entry += d;
      renderEntry();
    }

    function commit() {
      if (state.gameOver) return;
      const value = parseInt(entry === "" ? "0" : entry, 10);
      const p = state.players[state.active];

      if (value === 0) {
        p.zeroStreak++;
        if (p.zeroStreak >= 3) {
          p.score = 0;
          p.zeroStreak = 0;
          p.history.push("0⊘");
        } else {
          p.history.push("0");
        }
      } else {
        p.zeroStreak = 0;
        p.score += value;
        p.history.push(String(value));
      }

      entry = "";

      const winner = state.players.find(pl => pl.score >= state.target);
      if (winner) {
        state.gameOver = true;
        render();
        showWin(winner);
        return;
      }

      // tah dalšímu hráči v pořadí
      state.active = (state.active + 1) % state.players.length;
      render();
    }

    function undo() {
      const p = state.players[state.active];
      if (!p.history.length) return;
      p.history.pop();
      recompute(p);
      entry = "";
      render();
    }

    function recompute(p) {
      let score = 0, streak = 0;
      for (const h of p.history) {
        if (h === "0") { streak++; }
        else if (h === "0⊘") { score = 0; streak = 0; }
        else { score += parseInt(h, 10) || 0; streak = 0; }
      }
      p.score = score;
      p.zeroStreak = streak;
    }

    document.getElementById("keypad").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.d != null) pressDigit(btn.dataset.d);
      else if (btn.dataset.act === "clear") { entry = ""; renderEntry(); }
      else if (btn.dataset.act === "back") { entry = entry.slice(0, -1); renderEntry(); }
      else if (btn.dataset.act === "add") commit();
    });

    document.getElementById("undoBtn").onclick = undo;

    /* ---------- Settings ---------- */
    const settingsOverlay = document.getElementById("settingsOverlay");
    const playerListEl = document.getElementById("playerList");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    let draftNames = [];   // pracovní seznam jmen v nastavení

    function renderPlayerList() {
      playerListEl.innerHTML = "";
      draftNames.forEach((name, idx) => {
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML = `
          <span class="swatch" style="background:${colorOf(idx)}"></span>
          <input type="text" maxlength="14" value="${escapeHtml(name)}" data-idx="${idx}">
          <button class="remove" data-rm="${idx}" ${draftNames.length <= MIN_PLAYERS ? "disabled" : ""}>✕</button>
        `;
        playerListEl.appendChild(row);
      });
      addPlayerBtn.disabled = draftNames.length >= MAX_PLAYERS;
      // zachovat psaní
      playerListEl.querySelectorAll("input").forEach(inp => {
        inp.oninput = () => { draftNames[+inp.dataset.idx] = inp.value; };
      });
      playerListEl.querySelectorAll("[data-rm]").forEach(btn => {
        btn.onclick = () => {
          if (draftNames.length <= MIN_PLAYERS) return;
          draftNames.splice(+btn.dataset.rm, 1);
          renderPlayerList();
        };
      });
    }

    addPlayerBtn.onclick = () => {
      if (draftNames.length >= MAX_PLAYERS) return;
      draftNames.push("Hráč " + (draftNames.length + 1));
      renderPlayerList();
    };

    document.getElementById("settingsBtn").onclick = () => {
      draftNames = state.players.map(p => p.name);
      renderPlayerList();
      document.getElementById("targetInput").value = state.target;
      settingsOverlay.classList.add("show");
    };

    document.getElementById("saveBtn").onclick = () => {
      // cíl
      let t = parseInt(document.getElementById("targetInput").value, 10);
      if (isNaN(t) || t < MIN_TARGET) t = MIN_TARGET;
      state.target = t;

      // sladit počet hráčů s draftem (zachovat skóre existujících)
      const newPlayers = draftNames.map((name, i) => {
        const nm = (name || "").trim() || ("Hráč " + (i + 1));
        if (state.players[i]) {
          state.players[i].name = nm;
          return state.players[i];
        }
        return makePlayer(i); // nový hráč začíná od nuly
      });
      state.players = newPlayers;
      if (state.active >= state.players.length) state.active = 0;

      settingsOverlay.classList.remove("show");

      const winner = state.players.find(pl => pl.score >= state.target);
      state.gameOver = !!winner;
      render();
      if (winner) showWin(winner);
    };

    settingsOverlay.onclick = (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove("show"); };

    function startNewGame() {
      const names = state.players.map(p => p.name);
      const target = state.target;
      state = freshState(names.length);
      state.target = target;
      state.players.forEach((p, i) => p.name = names[i]);
      entry = "";
      settingsOverlay.classList.remove("show");
      document.getElementById("winOverlay").classList.remove("show");
      render();
    }
    document.getElementById("newGameBtn").onclick = startNewGame;
    document.getElementById("winNewGame").onclick = startNewGame;

    function showWin(winner) {
      document.getElementById("winText").textContent =
        `${winner.name} vyhrává s ${winner.score} body!`;
      document.getElementById("winOverlay").classList.add("show");
    }

    render();
    if (state.gameOver) {
      const w = state.players.find(pl => pl.score >= state.target);
      if (w) showWin(w);
    }
  </script>
</body>
</html>
